name: release-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      full_release_gate:
        description: Run browser E2E/fullstack release gate
        required: false
        default: "false"

jobs:
  quick-gate:
    name: quick gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Run quick CI gate
        run: make ci:quick

  docker-gate:
    name: docker gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t translate-video:ci .

      - name: Smoke image command
        run: docker run --rm translate-video:ci translate-video --help

  full-release-gate:
    name: full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_release_gate == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Install browser
        run: npx playwright install --with-deps chrome
        working-directory: ui

      - name: Run full release gate
        run: make test:release
